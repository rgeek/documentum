# DFC settings for Documentum Administrator (mirrors the chart's dbr.configmap).
# Both docbrokers, so DA keeps working if one Content Server is down.
dfc.docbroker.host[0]=dctm-cs-ora
dfc.docbroker.port[0]=1489
dfc.docbroker.host[1]=dctm-cs-ora2
dfc.docbroker.port[1]=1489
dfc.globalregistry.repository=ecmdev_ora
dfc.globalregistry.username=dm_bof_registry
# password comes from DFC_GLOBALREGISTRY_PASSWORD (set in docker-compose)
dfc.session.secure_connect_default=try_native_first
